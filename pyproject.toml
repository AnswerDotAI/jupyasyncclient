[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyasyncclient"
description = "Async kernel client for Jupyter Server via HTTP/WebSocket"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2"}
authors = [{name = "Jeremy Howard"}]
dynamic = ["version"]
dependencies = [
  "jupywire>=0.0.1",
  "httpx>=0.27",
  "fastcore>=2.1.17",
  "websockets>=13",
]

[project.urls]
Repository = "https://github.com/AnswerDotAI/jupyasyncclient"
Documentation = "https://AnswerDotAI.github.io/jupyasyncclient/"

[project.entry-points.nbdev]
jupyasyncclient = "jupyasyncclient._modidx:d"

[tool.nbdev]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "jupyter_server>=2",
  "ipykernel",
  "pytest-xdist",
  "pytest-timeout",
  "jupygate>=0.0.2",
  "ipymini>=0.1.17",
  "ipyfuncs>=0.0.1",
]

[tool.setuptools.packages.find]
include = ["jupyasyncclient"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n 3 --dist=loadfile"
timeout = 120
timeout_method = "thread"

[tool.setuptools.dynamic]
version = {attr = "jupyasyncclient.__version__"}

